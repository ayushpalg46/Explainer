[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["explainer*"]

[project]
name = "explainer-engine"
version = "1.0.0"
description = "Deep Codebase Architecture, Compatibility & Per-File Analysis Engine"
authors = [{ name = "Ayush Pal", email = "ayushpalg46@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
]

[project.scripts]
explainer = "explainer.cli:main"
expl = "explainer.cli:main"
EXPL = "explainer.cli:main"
